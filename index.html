<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2e222f">
  <link rel="icon" href="data:,">
  <title>All Roads Lead To Gnome | Survive Together</title>
  <style>
    :root { color-scheme: dark; background: #2e222f; color: #f2ec8b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: repeating-linear-gradient(0deg, #2e222f 0 7px, #352535 7px 8px); }
    #frame { width: min(1280px, calc(100vw - 32px), calc((100vh - 76px) * 16 / 9));
      border: 2px solid #cd683d; padding: 4px; background: #45293f; box-shadow: 8px 8px #1d1720; }
    #game { position: relative; aspect-ratio: 16 / 9; background: #2e222f; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #2e222f; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: #2e222f; }
    #load-art { width: min(90%, 680px); height: auto; image-rendering: pixelated; }
    footer { display: flex; align-items: center; justify-content: space-between; height: 38px; padding: 0 8px; }
    #brand { width: 240px; height: 24px; image-rendering: pixelated; }
    #fullscreen { background: #2e222f; border: 2px solid #cd683d; padding: 2px 8px; cursor: pointer; }
    #fullscreen:hover, #fullscreen:focus-visible { background: #993d41; border-color: #fbb954; }
    #full-art { width: 120px; height: 18px; image-rendering: pixelated; display: block; }
    #error { position: absolute; inset: 10%; display: none; padding: 24px; overflow: auto;
      background: #2e222f; border: 4px solid #993d41; font: 16px/1.5 monospace; white-space: pre-wrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    @media (max-width: 600px) { #frame { width: 100vw; } footer { height: 32px; } #brand { width: 180px; height: 18px; } }
  </style>
</head>
<body>
  <main id="frame">
    <div id="game">
      <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="All Roads Lead To Gnome cooperative survival game"></canvas>
      <div id="loading" role="status" aria-label="Loading All Roads Lead To Gnome">
        <canvas id="load-art" width="340" height="150"></canvas>
        <span class="sr-only" id="progress-text">Loading game</span>
      </div>
      <div id="error" role="alert"></div>
    </div>
    <footer>
      <canvas id="brand" width="160" height="16" aria-label="All Roads Lead To Gnome: survive together"></canvas>
      <button id="fullscreen" type="button" aria-label="Toggle fullscreen"><canvas id="full-art" width="80" height="12"></canvas></button>
    </footer>
  </main>
  <script>
    const glyphs = {
      A:"7E1111117E",B:"7F49494936",C:"3E41414122",D:"7F4141221C",E:"7F49494941",F:"7F09090901",
      G:"3E41495132",H:"7F0808087F",I:"00417F4100",J:"204040403F",K:"7F08142241",L:"7F40404040",
      M:"7F020C027F",N:"7F0408107F",O:"3E4141413E",P:"7F09090906",Q:"3E4151215E",R:"7F09192946",
      S:"2649494932",T:"01017F0101",U:"3F4040403F",V:"1F2040201F",W:"3F4038403F",X:"6314081463",
      Y:"0304780403",Z:"6151494543","0":"3E4549513E","1":"00427F4000","2":"4261514946","3":"2141454B31",
      "4":"1814127F10","5":"2745454539","6":"3C4A494930","7":"0171090503","8":"3649494936","9":"064949291E",
      " ":"0000000000","/":"2010080402","%":"2313086462",".":"0060600000"
    };
    function text(ctx, caption, x, y, size, color) {
      ctx.fillStyle = color;
      [...caption].forEach((c, index) => {
        const glyph = glyphs[c] || glyphs[" "];
        for (let column = 0; column < 5; column++) {
          const bits = parseInt(glyph.slice(column * 2, column * 2 + 2), 16);
          for (let row = 0; row < 7; row++)
            if (bits & (1 << row)) ctx.fillRect(x + (index * 6 + column) * size, y + row * size, size, size);
        }
      });
    }
    const art = document.getElementById("load-art").getContext("2d");
    function loading(progress) {
      art.fillStyle = "#2e222f"; art.fillRect(0, 0, 340, 150);
      art.fillStyle = "#cd683d"; art.fillRect(2, 2, 336, 146);
      art.fillStyle = "#2e222f"; art.fillRect(4, 4, 332, 142);
      text(art, "ALL ROADS", 62, 22, 4, "#fbb954");
      text(art, "LEAD TO GNOME", 18, 62, 4, "#f2ec8b");
      art.fillStyle = "#45293f"; art.fillRect(24, 114, 292, 12);
      art.fillStyle = "#fbb954"; art.fillRect(24, 114, Math.floor(292 * progress / 4) * 4, 12);
      text(art, "LOADING " + Math.floor(progress * 100) + "%", 112, 133, 1, "#cd683d");
      document.getElementById("progress-text").textContent = "Loading game " + Math.floor(progress * 100) + "%";
    }
    text(document.getElementById("brand").getContext("2d"), "ALL ROADS LEAD TO GNOME", 0, 4, 1, "#fbb954");
    text(document.getElementById("full-art").getContext("2d"), "FULLSCREEN", 10, 2, 1, "#f2ec8b");
    loading(0);
    function showError(message, type) {
      if (type !== "error") { console.warn(message); return; }
      const error = document.getElementById("error");
      error.style.display = "block";
      error.textContent = "ALL ROADS LEAD TO GNOME COULD NOT CONTINUE\n\n" + message + "\n\nRefresh this page to retry.";
    }
    const config = {
      dataUrl: "Build/WebGL.data.unityweb",
      frameworkUrl: "Build/WebGL.framework.js.unityweb",
      codeUrl: "Build/WebGL.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "All Roads Lead To Gnome",
      productVersion: "0.1.0",
      showBanner: showError
    };
    const loader = document.createElement("script");
    loader.src = "Build/WebGL.loader.js";
    loader.onerror = () => showError("The game loader could not be downloaded. Check your connection.", "error");
    loader.onload = () => createUnityInstance(document.getElementById("unity-canvas"), config, loading)
      .then(instance => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("fullscreen").onclick = () => instance.SetFullscreen(1);
      }).catch(message => showError(String(message), "error"));
    document.body.appendChild(loader);
  </script>
</body>
</html>
